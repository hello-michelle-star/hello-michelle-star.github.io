<header class="site-header">
  <h3 class="site-title"><a href="{{ site.github.url }}/">{{ site.title }}</a></h3>

  <div class="header-right">
    <nav class="menu-list" aria-label="Primary">
      {% for item in site.data.settings.menu %}
        {% unless item.name == "CV" %}
          <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
        {% endunless %}
      {% endfor %}
    </nav>

    <a
      href="{{ '/assets/pdf/CV Michelle Star (1).pdf' | uri_escape | relative_url }}"
      class="cv-button"
      target="_blank" rel="noopener"
    >CV</a>
  </div>

  <div class="dropdown">
    <button class="dropbtn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
      <i class="fa fa-bars" aria-hidden="true"></i>
    </button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
    </div>
  </div>
</header>
